<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>For Leila ✨</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff2f6;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:Poppins}
.card{width:94%;max-width:390px;background:white;border-radius:28px;box-shadow:0 25px 80px rgba(255,90,143,.25);overflow:hidden;text-align:center}
.top{height:210px;background:linear-gradient(135deg,#ffb5d8 0%,#ff7aa2 50%,#ff9a5c 100%);position:relative;display:flex;align-items:end;justify-content:center;padding-bottom:25px}
.top h1{font-family:Great Vibes;font-size:52px;color:white;text-shadow:0 3px 15px rgba(0,0,0,.2)}
.content{padding:26px 24px}
.badge{background:#ffe0eb;color:#e9307f;padding:6px 16px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:1.2px}
.name{font-family:Great Vibes;font-size:48px;color:#ff5a8f;margin:12px 0 4px}
.msg{color:#666;font-size:14.5px;line-height:1.7;margin-top:10px}
.details{margin:18px 0;background:#fff6f8;border-radius:16px;padding:14px;font-size:13px;color:#444;line-height:1.8}
.btn{background:#ff5a8f;color:white;border:none;padding:15px 26px;border-radius:30px;width:100%;font-weight:600;font-size:14px;margin-top:16px;box-shadow:0 10px 25px rgba(255,90,143,.4)}
.envelope{position:fixed;inset:0;background:#fff2f6;z-index:99;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:.9s cubic-bezier(.7,0,.3,1)}
.envelope.hide{transform:translateY(-110%)}
.heart{animation:pop 1.2s infinite alternate}
@keyframes pop{from{transform:scale(1)}to{transform:scale(1.2)}}
</style>
</head>
<body>
<div class="envelope" id="env">
<div class="heart" style="font-size:64px">💌</div>
<p style="font-family:Great Vibes;font-size:32px;color:#ff5a8f;margin:12px">For Leila...</p>
<button class="btn" style="width:auto;padding:12px 30px" onclick="document.getElementById('env').classList.add('hide')">Tap to open ✨</button>
</div>

<div class="top"><h1>Belated Birthday</h1></div>
