<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grasha Calc </title>
<style>
body{background:#fff0f6;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;font-family:sans-serif}
.calc{background:#1a1a2e;padding:20px;border-radius:30px;box-shadow:0 20px 50px rgba(0,0,0,0.3);width:300px}
#screen{width:100%;height:70px;background:#2a2a4a;color:white;border:none;border-radius:15px;font-size:28px;text-align:right;padding:10px;box-sizing:border-box;margin-bottom:15px}
.row{display:flex;gap:10px;margin-bottom:10px}
button{flex:1;height:60px;border:none;border-radius:15px;font-size:18px;font-weight:bold;cursor:pointer}
.num{background:white;color:#1a1a2e} .op{background:#ff4d8d;color:white} .eq{background:#ff8fab;color:#1a1a2e;flex:2} .clear{background:#3a3a5a;color:white}
button:active{transform:scale(0.95)}
</style>
</head>
<body>
<div class="calc">
<input id="screen" disabled placeholder="0">
<div class="row"><button class="clear" onclick="clr()">C</button><button class="clear" onclick="del()">⌫</button><button class="op" onclick="add('/')">÷</button></div>
<div class="row"><button class="num" onclick="add('7')">7</button><button class="num" onclick="add('8')">8</button><button class="num" onclick="add('9')">9</button><button class="op" onclick="add('*')">×</button></div>
<div class="row"><button class="num" onclick="add('4')">4</button><button class="num" onclick="add('5')">5</button><button class="num" onclick="add('6')">6</button><button class="op" onclick="add('-')">-</button></div>
<div class="row"><button class="num" onclick="add('1')">1</button><button class="num" onclick="add('2')">2</button><button class="num" onclick="add('3')">3</button><button class="op" onclick="add('+')">+</button></div>
<div class="row"><button class="num" onclick="add('0')">0</button><button class="num" onclick="add('.')">.</button><button class="eq" onclick="calc()">=</button></div>
<p style="text-align:center;color:#ffb3c6;font-size:12px;margin:10px 0 0">Made by Grasha  2110/2130 Project</p>
</div>
<script>
let s=document.getElementById('screen');
function add(v){s.value+=v}
function clr(){s.value=''}
function del(){s.value=s.value.slice(0,-1)}
function calc(){try{s.value=eval(s.value)}catch{s.value='Error '}}
</script>
</body>
</html>
